[project]
name = "go-reel-editor"
version = "0.1.2"
description = "GO! Reel Editor: X-reels, listicles, b-roll reels and yaps, edited by Claude on your own computer."
requires-python = ">=3.11,<3.13"
dependencies = [
  "pillow>=10.4",
  "numpy>=1.26",
  "opencv-python-headless>=4.9,<5",
]

[project.scripts]
gre = "gre.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gre"]

[dependency-groups]
dev = ["pytest>=8"]
